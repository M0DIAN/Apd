[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apd"
version = "0.3.2"
description = "Codex 多模型自动开发 Skill，通过 Luna、Sol、Astra 完成发现、实施、验证与独立复核"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai-codex", "PySide6"]

[project.scripts]
apd = "apd:main"
apd-gui = "apd_gui:main"

[tool.setuptools]
py-modules = ["apd", "apd_gui"]
packages = ["apd_ui"]

[tool.setuptools.package-dir]
apd_ui = "ui"

[tool.setuptools.package-data]
apd_ui = ["*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
